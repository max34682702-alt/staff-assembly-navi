<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>職員参集ナビ 画面確認版</title>
    <style>
      :root {
        color: #17212b;
        background: #f3f6f9;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 16px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #f3f6f9;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      .callButton {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 8px;
        padding: 15px 18px;
        background: #155e9f;
        color: #ffffff;
        font-weight: 800;
        text-align: center;
        text-decoration: none;
        line-height: 1.35;
        box-shadow: 0 3px 0 #0c3f6d;
      }

      button:active,
      .callButton:active {
        transform: translateY(1px);
        box-shadow: 0 2px 0 #0c3f6d;
      }

      .app {
        width: min(100%, 480px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 18px 14px 104px;
      }

      .appHeader {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 2px 14px;
      }

      .facility {
        margin: 0 0 4px;
        color: #4d5b68;
        font-size: 0.98rem;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        color: #17212b;
        font-size: 1.42rem;
        line-height: 1.25;
        letter-spacing: 0;
      }

      h2 {
        margin: 0;
        color: #17212b;
        font-size: 1.24rem;
        line-height: 1.35;
      }

      .smallButton {
        width: auto;
        min-width: 76px;
        min-height: 46px;
        padding: 10px 12px;
        background: #ffffff;
        color: #155e9f;
        border: 2px solid #b8c9d8;
        box-shadow: none;
        flex: 0 0 auto;
      }

      .panel {
        display: grid;
        gap: 20px;
        padding: 20px 16px;
        border: 1px solid #d9e2ea;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 8px 24px rgba(22, 42, 65, 0.08);
      }

      .lead {
        margin: 0;
        font-size: 1.03rem;
        line-height: 1.75;
      }

      .importantMessage {
        padding: 14px;
        border: 2px solid #f0d98c;
        border-left-width: 7px;
        border-radius: 8px;
        background: #fff8df;
        color: #251f13;
        font-size: 1.08rem;
        font-weight: 800;
      }

      .offlineNotice {
        margin: 0;
        padding: 13px 14px;
        border: 1px solid #d8e2ea;
        border-left: 6px solid #155e9f;
        border-radius: 8px;
        background: #f2f8fd;
        color: #213547;
        line-height: 1.7;
        font-weight: 700;
      }

      .buttonStack {
        display: grid;
        gap: 14px;
      }

      .secondary {
        background: #edf3f8;
        color: #17405f;
        border: 1px solid #c7d7e4;
        box-shadow: 0 3px 0 #b3c6d6;
      }

      .copyButton {
        background: #0f766e;
        box-shadow: 0 3px 0 #0b4f4a;
      }

      .checkList {
        display: grid;
        gap: 12px;
      }

      .checkList label {
        display: grid;
        grid-template-columns: 30px 1fr;
        align-items: start;
        gap: 12px;
        padding: 15px 14px;
        border: 1px solid #d8e2ea;
        border-radius: 8px;
        background: #f9fbfd;
        color: #17212b;
        line-height: 1.7;
        font-weight: 700;
      }

      .checkList input {
        width: 22px;
        height: 22px;
        margin: 2px 0 0;
        accent-color: #155e9f;
      }

      .badge {
        display: inline-flex;
        width: fit-content;
        margin: 0;
        padding: 9px 13px;
        border-radius: 999px;
        background: #fff0c2;
        color: #4a3600;
        font-weight: 800;
      }

      .formGrid {
        display: grid;
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 8px;
        color: #17212b;
        font-weight: 800;
      }

      .field small {
        color: #4b5b68;
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1.6;
      }

      .examples {
        display: grid;
        gap: 6px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #f9fbfd;
        color: #354554;
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1.55;
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        min-height: 56px;
        border: 2px solid #b9c9d8;
        border-radius: 8px;
        padding: 14px 12px;
        background: #ffffff;
        color: #17212b;
        font-size: 1rem;
      }

      .field textarea {
        min-height: 118px;
        resize: vertical;
        line-height: 1.65;
      }

      .reportBox {
        padding: 16px;
        border: 2px solid #9cc5e6;
        border-radius: 8px;
        background: #f2f8fd;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        color: #111827;
        line-height: 1.75;
        font-family: inherit;
        font-size: 1.02rem;
      }

      .success {
        margin: 0;
        padding: 14px;
        border: 2px solid #9fd8b1;
        border-radius: 8px;
        background: #e8f8ee;
        color: #0f5b2f;
        font-size: 1.06rem;
        font-weight: 800;
        text-align: center;
      }

      .methodList,
      .stepList {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: steps;
      }

      .methodList li,
      .stepList li {
        padding: 15px;
        border: 1px solid #d8e2ea;
        border-radius: 8px;
        background: #f9fbfd;
        line-height: 1.65;
      }

      .methodList strong,
      .methodList span,
      .methodList em {
        display: block;
      }

      .methodList strong {
        color: #155e9f;
        font-size: 1.1rem;
      }

      .methodList span {
        color: #354554;
        margin-top: 4px;
      }

      .methodList em {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #fff8df;
        color: #5a4100;
        font-style: normal;
        font-weight: 800;
      }

      .methodList button {
        margin-top: 12px;
      }

      .stepList li {
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 10px;
        align-items: start;
        font-weight: 700;
      }

      .stepList li::before {
        counter-increment: steps;
        content: counter(steps);
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 999px;
        background: #155e9f;
        color: #ffffff;
        font-weight: 800;
      }

      .phoneDisplay {
        display: grid;
        gap: 6px;
        padding: 16px;
        border: 2px solid #f0d98c;
        border-radius: 8px;
        background: #fff8df;
        text-align: center;
      }

      .phoneDisplay span {
        color: #4d3b00;
        font-weight: 800;
      }

      .phoneDisplay strong {
        color: #17212b;
        font-size: 1.7rem;
        line-height: 1.2;
      }

      .footerNav {
        position: fixed;
        left: 50%;
        bottom: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        width: min(100%, 480px);
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        background: #ffffff;
        border-top: 1px solid #cfdbe5;
        box-shadow: 0 -8px 22px rgba(22, 42, 65, 0.12);
        transform: translateX(-50%);
      }

      .footerNav button {
        min-height: 52px;
        padding: 8px 6px;
        border: 1px solid #c7d7e4;
        background: #edf3f8;
        color: #17405f;
        box-shadow: none;
        font-size: 0.9rem;
        font-weight: 800;
      }

      .footerNav button.active {
        background: #155e9f;
        color: #ffffff;
        border-color: #155e9f;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const facilityConfig = {
        facilityName: "シェ・モア",
        facilitySmartphone: "080-3737-0189",
        facilityEmail: "chezmoi1319@gmail.com",
        representativePhone: "046-236-1318",
        dial171Phone: "046-236-1318",
        lineNote:
          "施設LINEまたは指定の連絡グループへ、コピーした報告文を送信してください。未登録の職員はSMSまたはメールを使用してください。"
      };

      const STORAGE_KEY = "staffAssemblyNaviReport";
      const initialReport = {
        location: "",
        safety: "無事",
        attendance: "判断中",
        eta: "現時点では不明",
        transport: "徒歩",
        assemblyNote: "",
        family: "安否確認中",
        home: "確認中",
        note: ""
      };

      const transportOptions = ["徒歩", "自転車", "車", "公共交通機関", "家族送迎", "未定", "その他"];
      const etaOptions = ["30分以内", "1時間以内", "2時間以内", "3時間以上", "公共交通機関復旧後", "家族対応後", "現時点では不明", "その他"];

      const attendanceMap = {
        "参集できる": "可能",
        "条件付きで参集できる": "条件付き",
        "今は参集できない": "不可",
        "まだ判断できない": "判断中"
      };

      const intensityDetailMap = {
        "震度5弱以下": {
          title: "参集基準：震度5弱以下",
          text: "原則として通常運営です。ただし、自宅・家族・交通状況に影響がある場合は、施設スマホへ報告してください。",
          checks: [
            "自分と家族の安全を確認する",
            "自宅に大きな被害がないか確認する",
            "通勤・出勤に支障がある場合は施設スマホへ報告する",
            "通常勤務が難しい場合は、早めに施設スマホへ報告する"
          ],
          buttons: ["report", "attendance", "intensity"]
        },
        "震度5強": {
          title: "参集基準：震度5強",
          text: "施設長、管理職、災害対応担当者を中心に参集を検討します。その他職員は、施設からの連絡に備えてください。",
          checks: [
            "自分と家族の安全を確保する",
            "自宅の被害状況を確認する",
            "施設からの連絡に備える",
            "出勤・勤務に影響がある場合は施設スマホへ報告する",
            "施設から指示があった場合は、参集可否を報告する"
          ],
          buttons: ["general", "manager", "report", "attendance", "intensity"]
        },
        "震度6弱": {
          title: "参集基準：震度6弱",
          text: "役職者は参集対象です。その他職員は緊急招集に備え、施設スマホへ安否と参集可否を報告してください。",
          checks: [
            "自分と家族の安全を確保する",
            "自宅の被害状況を確認する",
            "施設スマホへ安否と参集可否を報告する",
            "施設からの緊急招集に備える",
            "指示があるまでは無理に移動を開始しない"
          ],
          buttons: ["general", "manager", "report", "attendance", "intensity"]
        },
        "震度6強以上": {
          title: "参集基準：震度6強以上",
          text: "全職員が参集対象です。ただし、本人・家族の安全確保、自宅の安全確認、移動経路の安全確認を行ったうえで、施設スマホへ報告してください。",
          checks: [
            "自分の安全を確保した",
            "家族の安否を確認した、または確認中",
            "自宅の被害状況を確認した、または確認中",
            "移動経路の危険性を確認した",
            "施設スマホへ参集可否を報告する"
          ],
          buttons: ["attendance", "report", "intensity"]
        },
        "震度がわからない": {
          title: "震度がわからない場合",
          text: "震度が不明でも、大きな揺れを感じた場合や、自宅・家族・交通状況に影響がある場合は、施設スマホへ報告してください。",
          checks: [
            "自分と家族の安全を確認する",
            "自宅の被害状況を確認する",
            "テレビ・ラジオ・防災アプリ等で情報を確認する",
            "施設へ連絡できる場合は、現在の状況を報告する",
            "参集できるか不明な場合も「判断中」として報告する"
          ],
          buttons: ["attendance", "report", "intensity"]
        }
      };

      const roleDetailMap = {
        "震度5強": {
          general: {
            title: "震度5強：一般職員向け",
            text: "施設からの連絡に備えてください。出勤・勤務・自宅や家族の状況に影響がある場合は、施設スマホへ状況を報告してください。",
            checks: [
              "自分と家族の安全を確保する",
              "自宅の被害状況を確認する",
              "施設からの連絡に備える",
              "出勤・勤務に影響がある場合は施設スマホへ報告する",
              "施設から指示があった場合は、参集可否を報告する"
            ],
            buttons: ["report", "attendance", "backDetail", "intensity"]
          },
          manager: {
            title: "震度5強：役職者向け",
            text: "役職者は、自分と家族の安全を確保したうえで、施設スマホへ参集可否を報告してください。",
            checks: [
              "自分と家族の安全を確保する",
              "施設スマホへ参集可否を報告する",
              "参集可能な場合、移動手段と到着見込みを報告する",
              "参集困難な場合、理由と連絡可能状況を報告する"
            ],
            buttons: ["attendance", "report", "backDetail", "intensity"]
          }
        },
        "震度6弱": {
          general: {
            title: "震度6弱：一般職員向け",
            text: "施設スマホへ安否と参集可否を報告してください。指示があるまでは、無理に移動を開始しないでください。",
            checks: [
              "自分と家族の安全を確保する",
              "自宅の被害状況を確認する",
              "施設スマホへ安否と参集可否を報告する",
              "施設からの緊急招集に備える",
              "指示があるまでは無理に移動を開始しない"
            ],
            buttons: ["attendance", "report", "backDetail", "intensity"]
          },
          manager: {
            title: "震度6弱：役職者向け",
            text: "役職者は参集対象です。施設スマホへ参集可否、移動手段、到着見込みを報告してください。",
            checks: [
              "自分と家族の安全を確保する",
              "施設スマホへ参集可否を報告する",
              "参集可能な場合、移動手段と到着見込みを報告する",
              "参集困難な場合、理由と連絡可能状況を報告する",
              "参集後、施設状況の把握・職員体制確認を行う"
            ],
            buttons: ["attendance", "report", "backDetail", "intensity"]
          }
        }
      };

      const screenTitles = {
        top: "職員参集ナビ",
        earthquake: "地震時の参集判断",
        intensity: "震度を選択してください",
        intensityDetail: "震度別の確認",
        roleDetail: "職員区分別の確認",
        attendance: "参集可否を選択してください",
        report: "報告文作成",
        contact: "連絡手段確認",
        dial171: "災害用伝言ダイヤル171"
      };

      const detailButtonLabels = {
        general: "一般職員向け",
        manager: "役職者向け",
        report: "施設へ報告する内容を見る",
        attendance: "参集可否を選択する",
        statusReport: "状況を報告する",
        backDetail: "震度別画面へ戻る",
        intensity: "震度選択へ戻る"
      };

      const detailButtonTargets = {
        report: "report",
        attendance: "attendance",
        statusReport: "attendance",
        backDetail: "intensityDetail",
        intensity: "intensity"
      };

      let screen = "top";
      let intensity = "";
      let roleType = "";
      let copied = false;
      let created = false;
      let notice = "";
      let report = loadReport();

      function loadReport() {
        try {
          return normalizeReport({ ...initialReport, ...JSON.parse(localStorage.getItem(STORAGE_KEY)) });
        } catch {
          return { ...initialReport };
        }
      }

      function normalizeReport(value) {
        return {
          ...value,
          family: value.family === "確認必要" ? "安否確認中" : value.family,
          eta: !value.eta || etaOptions.includes(value.eta) ? value.eta : "その他",
          transport: !value.transport || transportOptions.includes(value.transport) ? value.transport : "その他"
        };
      }

      function formatAttendance(value) {
        const labels = {
          不可: "現時点では不可",
          判断中: "現時点では判断中",
          条件付き: "条件付きで可能",
          可能: "可能"
        };
        return labels[value] || value;
      }

      function valueOrFallback(value, fallback) {
        return value && value.trim() ? value : fallback;
      }

      function formatTransport(value) {
        return valueOrFallback(value, "未定");
      }

      function createSmsUrl(text) {
        const phone = facilityConfig.facilitySmartphone.replaceAll("-", "");
        return `sms:${phone}?body=${encodeURIComponent(text)}`;
      }

      function createMailUrl(text) {
        return `mailto:${facilityConfig.facilityEmail}?subject=${encodeURIComponent("職員参集報告")}&body=${encodeURIComponent(text)}`;
      }

      function saveReport() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(report));
        } catch {}
      }

      function reportText() {
        return [
          `現在地：${valueOrFallback(report.location, "未入力")}`,
          `本人安否：${report.safety}`,
          `参集：${formatAttendance(report.attendance)}`,
          `移動手段：${formatTransport(report.transport)}`,
          `到着見込み：${valueOrFallback(report.eta, "現時点では不明")}`,
          `家族状況：${report.family}`,
          `自宅状況：${report.home}`,
          `参集に関する補足：${valueOrFallback(report.assemblyNote, "なし")}`,
          `その他：${valueOrFallback(report.note, "なし")}`
        ].join("\n");
      }

      function go(nextScreen) {
        screen = nextScreen;
        copied = false;
        notice = "";
        render();
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function button(label, action, className = "") {
        return `<button class="${className}" data-action="${action}">${label}</button>`;
      }

      function examples(items) {
        return `<div class="examples">${items.map((item) => `<span>${item}</span>`).join("")}</div>`;
      }

      function checkList(items) {
        return `<div class="checkList">${items
          .map((item) => `<label><input type="checkbox" /><span>${item}</span></label>`)
          .join("")}</div>`;
      }

      function renderShell(content) {
        document.getElementById("app").innerHTML = `
          <div class="app">
            <header class="appHeader">
              <div>
                <p class="facility">${facilityConfig.facilityName}</p>
                <h1>${screenTitles[screen]}</h1>
              </div>
              ${screen !== "top" ? button("トップ", "go:top", "smallButton") : ""}
            </header>
            <main>${content}</main>
            <nav class="footerNav" aria-label="ショートカット">
              ${[
                ["top", "トップ"],
                ["report", "報告文"],
                ["contact", "連絡手段"],
                ["dial171", "171"]
              ]
                .map(([target, label]) =>
                  `<button class="${screen === target ? "active" : ""}" data-action="go:${target}">${label}</button>`
                )
                .join("")}
            </nav>
          </div>
        `;
      }

      function render() {
        const renderers = {
          top: renderTop,
          earthquake: renderEarthquake,
          intensity: renderIntensity,
          intensityDetail: renderIntensityDetail,
          roleDetail: renderRoleDetail,
          attendance: renderAttendance,
          report: renderReport,
          contact: renderContact,
          dial171: renderDial171
        };
        renderShell(renderers[screen]());
        bindEvents();
      }

      function renderTop() {
        return `
          <section class="panel">
            <p class="lead importantMessage">災害時に、施設への連絡内容と参集判断を確認するナビです。まずは、自分と家族の安全を確保してください。</p>
            <p class="offlineNotice">このナビは、事前にスマホで開いておくことで、通信が不安定な状況でも基本画面を確認できます。SMS・メール・LINE・電話・171の利用には通信状況が必要です。</p>
            <div class="buttonStack">
              ${button("地震のとき", "go:earthquake")}
              ${button("施設へ報告する内容", "go:report")}
              ${button("連絡手段を確認", "go:contact")}
              ${button("171の使い方", "go:dial171")}
            </div>
          </section>
        `;
      }

      function renderEarthquake() {
        return `
          <section class="panel">
            <p class="lead importantMessage">地震発生時は、まず自分と家族の安全確保を優先してください。そのうえで、施設への報告・参集可否の確認を行います。</p>
            ${checkList([
              "自分の安全を確保した",
              "家族の安全を確認した、または確認中",
              "自宅の被害状況を確認した、または確認中",
              "施設へ連絡できる手段を確認する"
            ])}
            ${button("震度を選択する", "go:intensity")}
          </section>
        `;
      }

      function renderIntensity() {
        return `
          <section class="panel">
            <div class="buttonStack">
              ${["震度5弱以下", "震度5強", "震度6弱", "震度6強以上", "震度がわからない"]
                .map((item) => button(item, `intensity:${item}`))
                .join("")}
            </div>
          </section>
        `;
      }

      function renderIntensityDetail() {
        const detail = intensityDetailMap[intensity] || intensityDetailMap["震度がわからない"];
        return `
          <section class="panel">
            <h2>${detail.title}</h2>
            <p class="lead importantMessage">${detail.text}</p>
            ${checkList(detail.checks)}
            <div class="buttonStack">
              ${detail.buttons
                .map((key) => button(detailButtonLabels[key], `detail:${key}`, key === "intensity" ? "secondary" : ""))
                .join("")}
            </div>
          </section>
        `;
      }

      function renderRoleDetail() {
        const detail = (roleDetailMap[intensity] && roleDetailMap[intensity][roleType]) || roleDetailMap["震度5強"].general;
        return `
          <section class="panel">
            <h2>${detail.title}</h2>
            <p class="lead importantMessage">${detail.text}</p>
            ${checkList(detail.checks)}
            <div class="buttonStack">
              ${detail.buttons
                .map((key) => {
                  const label = key === "backDetail" ? `${intensity}へ戻る` : detailButtonLabels[key];
                  const displayLabel =
                    roleType === "general" && intensity === "震度5強" && key === "attendance"
                      ? detailButtonLabels.statusReport
                      : label;
                  const cls = key === "backDetail" || key === "intensity" ? "secondary" : "";
                  return button(displayLabel, `detail:${key}`, cls);
                })
                .join("")}
            </div>
          </section>
        `;
      }

      function renderAttendance() {
        return `
          <section class="panel">
            ${intensity ? `<p class="badge">選択した震度：${intensity}</p>` : ""}
            <p class="lead importantMessage">現時点での状況を選択してください。後で状況が変わった場合は、再度施設スマホへ報告してください。</p>
            <div class="buttonStack">
              ${["参集できる", "条件付きで参集できる", "今は参集できない", "まだ判断できない"]
                .map((item) => button(item, `attendance:${item}`))
                .join("")}
            </div>
          </section>
        `;
      }

      function field(label, key) {
        return `<label class="field"><span>${label}</span><input data-field="${key}" value="${escapeHtml(report[key])}" /></label>`;
      }

      function selectField(label, key, options) {
        return `
          <label class="field">
            <span>${label}</span>
            <select data-field="${key}">
              ${options.map((option) => `<option value="${option}" ${report[key] === option ? "selected" : ""}>${option}</option>`).join("")}
            </select>
          </label>
        `;
      }

      function renderReport() {
        return `
          <section class="panel">
            <p class="offlineNotice">報告文の作成とコピーは、通信が不安定な状況でも利用できます。通信が戻ったら、コピーした報告文をSMS・メール・LINEなどで送ってください。</p>
            <div class="formGrid">
              ${field("現在地", "location")}
              ${selectField("本人安否", "safety", ["無事", "負傷あり"])}
              ${selectField("参集可否", "attendance", ["可能", "条件付き", "不可", "判断中"])}
              ${selectField("移動手段", "transport", transportOptions)}
              ${selectField("到着見込み", "eta", etaOptions)}
              ${selectField("家族状況", "family", ["問題なし", "安否確認中", "対応中", "不明"])}
              ${selectField("自宅状況", "home", ["問題なし", "被害あり", "確認中", "不明"])}
              <label class="field">
                <span>参集に関する補足</span>
                <small>必要に応じて、移動経路や参集できる条件を入力してください。</small>
                ${examples([
                  "例：家族の安否確認後に出発します",
                  "例：橋が通れれば車で30分程度です",
                  "例：公共交通機関が復旧すれば参集可能です",
                  "例：子どもの預け先を確認中です",
                  "例：道路状況確認後に再連絡します"
                ])}
                <textarea data-field="assemblyNote" rows="4" placeholder="例：家族確認後に出発、橋が通れれば車で30分程度 など">${escapeHtml(report.assemblyNote)}</textarea>
              </label>
              <label class="field">
                <span>その他</span>
                <small>施設へ伝えておきたいことがあれば入力してください。</small>
                ${examples([
                  "例：自宅に一部破損があります",
                  "例：家族対応中のため、再度連絡します",
                  "例：携帯の充電が少ないです",
                  "例：近隣道路が混雑しています"
                ])}
                <textarea data-field="note" rows="4" placeholder="例：自宅被害あり、家族対応中、携帯充電少ない など">${escapeHtml(report.note)}</textarea>
              </label>
            </div>
            <div class="reportBox">
              <h2>生成した報告文</h2>
              <pre>${escapeHtml(reportText())}</pre>
            </div>
            ${created ? `<p class="success">報告文を作成しました</p>` : ""}
            ${copied ? `<p class="success">コピーしました</p>` : ""}
            ${notice ? `<p class="success">${notice}</p>` : ""}
            <p class="offlineNotice">SMS・メール・LINE等の送信には通信状況が必要です。通信が不安定な場合は、先に報告文をコピーしておき、通信が戻ってから送信してください。誤送信防止のため、最後の送信操作は本人が行ってください。</p>
            <p class="offlineNotice">機種によっては本文が自動入力されない場合があります。その場合は、報告文をコピーして貼り付けてください。</p>
            <div class="buttonStack">
              ${button("報告文を作成する", "createReport", "secondary")}
              ${button("報告文をコピーする", "copyReport", "copyButton")}
              ${button("SMSで送る", "sendSms")}
              ${button("メールで送る", "sendMail")}
              ${button("LINE・SNSで共有", "shareReport")}
              ${button("入力内容をリセット", "resetReport", "secondary")}
              ${button("連絡手段を確認", "go:contact", "secondary")}
            </div>
          </section>
        `;
      }

      function renderContact() {
        const methods = [
          ["1. SMS", facilityConfig.facilitySmartphone, "SMSで送る", "sendSms"],
          ["2. メール", facilityConfig.facilityEmail, "メールで送る", "sendMail"],
          [
            "3. LINE",
            "施設LINEまたは指定の連絡グループ",
            "LINE・SNSで共有",
            "shareReport",
            "未登録の職員はSMSまたはメールを使用してください。"
          ],
          ["4. 電話", facilityConfig.representativePhone, "電話する", "callPhone"],
          ["5. 171", facilityConfig.dial171Phone, "171の使い方を見る", "go:dial171"]
        ];
        return `
          <section class="panel">
            <p class="lead importantMessage">つながる方法で、短く報告してください。電話は混雑しやすいため、文字で残せる手段を優先します。</p>
            <p class="offlineNotice">このナビは、事前にスマホで開いておくことで、通信が不安定な状況でも基本画面を確認できます。SMS・メール・LINE・電話・171の利用には通信状況が必要です。</p>
            ${!created ? `<p class="offlineNotice">先に報告文を作成してください。SMS・メール・LINE共有では、作成済みの報告文を使用します。</p>` : ""}
            <ol class="methodList">
              ${methods.map(([name, detail, actionLabel, action, caution]) => `<li><strong>${name}</strong><span>${detail}</span>${caution ? `<em>${caution}</em>` : ""}${button(actionLabel, `contact:${action}`)}</li>`).join("")}
            </ol>
          </section>
        `;
      }

      function renderDial171() {
        return `
          <section class="panel">
            <p class="lead importantMessage">171は、SMS・メール・LINE・電話で施設へ連絡できない場合の補助的な連絡手段です。</p>
            <p class="offlineNotice">171への発信には通信状況が必要です。圏外の場合は、報告文を作成・コピーしておき、通信が戻ったら送信してください。</p>
            <div class="phoneDisplay"><span>施設電話番号</span><strong>${facilityConfig.dial171Phone}</strong></div>
            <a class="callButton" href="tel:171">171へ電話する</a>
            <ol class="stepList">
              <li>171へ電話する</li>
              <li>録音は「1」を選ぶ</li>
              <li>施設の電話番号を入力する（${facilityConfig.dial171Phone}）</li>
              <li>音声案内に従い、現在地・本人安否・参集可否・到着見込み・家族状況を短く残す</li>
            </ol>
            <p class="offlineNotice">171に残す内容は、完璧でなくて構いません。施設が状況を把握できるよう、短く伝えることを優先してください。</p>
          </section>
        `;
      }

      function bindEvents() {
        document.querySelectorAll("[data-action]").forEach((element) => {
          element.addEventListener("click", async () => {
            const action = element.dataset.action;
            if (action.startsWith("go:")) {
              go(action.slice(3));
              return;
            }
            if (action.startsWith("intensity:")) {
              intensity = action.slice(10);
              roleType = "";
              go("intensityDetail");
              return;
            }
            if (action.startsWith("attendance:")) {
              report.attendance = attendanceMap[action.slice(11)];
              saveReport();
              go("report");
              return;
            }
            if (action.startsWith("detail:")) {
              const key = action.slice(7);
              if (key === "general" || key === "manager") {
                roleType = key;
                go("roleDetail");
                return;
              }
              go(detailButtonTargets[key]);
              return;
            }
            if (action === "createReport") {
              saveReport();
              created = true;
              copied = false;
              notice = "";
              render();
              return;
            }
            if (action === "copyReport") {
              await copyReport();
              copied = true;
              notice = "";
              created = false;
              render();
              return;
            }
            if (action === "sendSms") {
              window.location.href = createSmsUrl(reportText());
              return;
            }
            if (action === "sendMail") {
              window.location.href = createMailUrl(reportText());
              return;
            }
            if (action === "shareReport") {
              await shareReport();
              return;
            }
            if (action === "resetReport") {
              report = { ...initialReport };
              try {
                localStorage.removeItem(STORAGE_KEY);
              } catch {}
              copied = false;
              created = false;
              notice = "";
              render();
            }
            if (action.startsWith("contact:")) {
              const contactAction = action.slice(8);
              if (!created && ["sendSms", "sendMail", "shareReport"].includes(contactAction)) {
                alert("先に報告文を作成してください");
                go("report");
                return;
              }
              if (contactAction === "sendSms") window.location.href = createSmsUrl(reportText());
              if (contactAction === "sendMail") window.location.href = createMailUrl(reportText());
              if (contactAction === "shareReport") await shareReport();
              if (contactAction === "callPhone") window.location.href = `tel:${facilityConfig.representativePhone}`;
              if (contactAction.startsWith("go:")) go(contactAction.slice(3));
            }
          });
        });

        document.querySelectorAll("[data-field]").forEach((element) => {
          element.addEventListener("input", () => {
            report[element.dataset.field] = element.value;
            copied = false;
            created = false;
            notice = "";
            saveReport();
            const pre = document.querySelector(".reportBox pre");
            if (pre) pre.textContent = reportText();
          });
          element.addEventListener("change", () => {
            report[element.dataset.field] = element.value;
            saveReport();
            const pre = document.querySelector(".reportBox pre");
            if (pre) pre.textContent = reportText();
          });
        });
      }

      async function copyReport() {
        try {
          if (!navigator.clipboard) throw new Error("Clipboard API is not available.");
          await navigator.clipboard.writeText(reportText());
        } catch {
          const textarea = document.createElement("textarea");
          textarea.value = reportText();
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }
      }

      async function shareReport() {
        if (navigator.share) {
          try {
            await navigator.share({ text: reportText() });
            notice = "";
            render();
            return;
          } catch {
            return;
          }
        }

        await copyReport();
        copied = false;
        notice = "報告文をコピーしました。LINEまたは指定の連絡グループに貼り付けて送信してください。";
        render();
      }

      render();
    </script>
  </body>
</html>
